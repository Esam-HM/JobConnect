<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" type="text/css" href="../CSS/company-post-job.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
</head>
<body>
    <header>
        <div class="dropdown">
            <button class="dropbtn">Menu</button>
            <div class="dropdown-content">
                <a href="./company-home.html">Home</a>
                <a href="./profile-company.html">Profile</a>
                <a href="./logIn.html" class="log-out">Log Out</a>
            </div>
        </div>
        <div class="logo">
            <img src="../ytulogopng.png" alt="Logo">
        </div>
    </header>

    <div class="job-form">
        <h2>Post a New Job</h2>
        <form>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required><br><br>

            <label for="job-description">Job Description:</label>
            <textarea id="job-description" name="description" required></textarea><br><br>

            <label for="job-type">Job Type:</label>
            <select id="job-type" name="job_type">
                <option value=""></option>
                <option value="full">Full Time</option>
                <option value="part">Part Time</option>
                <option value="hybrid">Hybrid</option><br><br>
            </select>
            <br><br>
            <label for="filter">Job filter :</label>
            <select name="filter" id="filter" required>
                <option value=""></option>
                <option value="it">IT</option>
                <option value="finance">Finans</option>
                <option value="marketing">Pazarlama</option>
                <option value="hr">İnsan Kaynakları</option>
                <option value="sales">Satış</option>
                <option value="intern">Staj</option>            </select>
            <br><br>
            <button type="submit">Submit</button> 
        </form>
    </div>
    <script src="../JS/post_job.js"></script>
</body>
</html>
