<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="../CSS/logIn.css">
</head>
<body>
    <div class="login-container">
        <form action="" method="post">
            <h2>Login</h2>
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" required>
            </div>
            <div class="input-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="passw" required maxlength="5">
            </div>
            <button type="submit">Login</button>
            <p class="register-link">Don't have an account? <a href="#" id="registerLink">Register</a></p>
        </form>

        
        <div id="registrationOptions" class="hidden">
            <p>Please select your registration type:</p>
            <button onclick="location.href='./user_register.html '">User</button>
            <button onclick="location.href='./company_register.html '">Company</button>
        </div>
    </div>
    <script src="../JS/logIn.js" defer></script>

</body>
</html>
